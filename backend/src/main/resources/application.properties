spring.application.name=hospitality-platform

# ===================================================================
# LOCAL CONFIGURATION IMPORT (Ignored by Git)
# ===================================================================
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties,optional:classpath:application-local.properties

# ===================================================================
# POSTGRESQL DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospitality_db}}}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=${PORT:${SERVER_PORT:8080}}

# ===================================================================
# CORS CONFIGURATION (Allows Vercel domains and local dev)
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}

# ===================================================================
# JWT SECURITY CONFIGURATION
# ===================================================================
# 256-bit secret key in base64/hex for HS256 algorithm
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds (86,400,000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===================================================================
# AI CHATBOT CONFIGURATION
# ===================================================================
# Keep AI modular: if no key is provided, FallbackHospitalityService is used
ai.api.key=${AI_API_KEY:}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-1.5-flash}

# ===================================================================
# LOGGING
# ===================================================================
logging.level.com.hospitality=INFO
logging.level.org.springframework.security=INFO
