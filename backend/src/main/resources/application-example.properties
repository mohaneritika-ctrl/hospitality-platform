# ===================================================================
# Hospitality Platform - Example Spring Boot Configuration
# ===================================================================

spring.application.name=hospitality-platform

# PostgreSQL Database Configuration (Replace with your credentials)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospitality_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=${SERVER_PORT:8080}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:your_256_bit_jwt_secret_key_here}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Chatbot Configuration (Optional)
ai.api.key=${AI_API_KEY:}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-1.5-flash}
